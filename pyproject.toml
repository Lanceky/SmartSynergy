[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsynergy"
version = "0.1.0"
description = "Contradiction-first evidence watch for oncology combination-therapy hypotheses, built with the Strands Agents SDK"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Lanceky" }]
keywords = ["strands-agents", "aws", "bedrock", "oncology", "literature-monitoring", "agents-for-humans"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "strands-agents==1.55.1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "streamlit>=1.37,<2",
  "boto3>=1.34",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
agentcore = ["bedrock-agentcore==1.22.0"]

[project.urls]
Repository = "https://github.com/Lanceky/SmartSynergy"

[tool.setuptools.packages.find]
include = ["smartsynergy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
